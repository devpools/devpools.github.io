# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: devpools blog
subtitle: 개발 바보들의 놀이터
description: 개발 바보들 모여라
author: devpools
language: ko
timezone: Asia/Seoul

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: http://www.devpools.kr
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace:
  
# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date
  
# Category & Tag
default_category: Tech Trends
category_map: JavaScript, Tech Trends, AI, Tech HR
tag_map:
  # 운영 사이트의 기존 주소(/tags/front-end/)를 유지한다
  Front-End: front-end
  Front-end: front-end

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: hueman

# Deployment
## 배포는 GitHub Actions(.github/workflows)가 담당한다. hexo deploy 는 쓰지 않는다.

category_generator:
  per_page: 20

tag_generator:
  per_page: 10

menu:
 archives: true
 tags: true
 categories: true
 #marked setting for markdown

marked:
  prependRoot: true # 본문의 /images/... 경로 앞에 root 를 붙인다 (미리보기 하위 경로 대응)
  gfm: true
  pedantic: false
  sanitize: false
  tables: true
  breaks: true
  smartLists: true
  smartypants: true

gcs: # GOOGLE CUSTOM SEARCH
disqus: # DISQUS ID

location: Asia/Seoul
email: ehrudxo@gmail.com

avatar: https://avatars2.githubusercontent.com/u/5300359?v=4&s=460
social:
  github: https://github.com/devpools
  facebook: https://www.facebook.com/groups/1685004178439716/
